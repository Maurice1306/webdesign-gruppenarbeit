<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
  <title id="title">Die vier Kartenfarben</title>
  <desc id="desc">Kreuz, Pik, Herz und Karo in vier Kartenflächen.</desc>
  <rect width="800" height="220" fill="#f4f0e6"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="25" y="25" width="170" height="170" rx="12" fill="#ffffff" stroke="#174a3a" stroke-width="4"/>
    <text x="110" y="125" font-size="80" fill="#1d2925">♣</text>
    <text x="110" y="178" font-size="20" fill="#174a3a">Kreuz</text>

    <rect x="215" y="25" width="170" height="170" rx="12" fill="#ffffff" stroke="#174a3a" stroke-width="4"/>
    <text x="300" y="125" font-size="80" fill="#1d2925">♠</text>
    <text x="300" y="178" font-size="20" fill="#174a3a">Pik</text>

    <rect x="405" y="25" width="170" height="170" rx="12" fill="#ffffff" stroke="#174a3a" stroke-width="4"/>
    <text x="490" y="125" font-size="80" fill="#b51f35">♥</text>
    <text x="490" y="178" font-size="20" fill="#174a3a">Herz</text>

    <rect x="595" y="25" width="170" height="170" rx="12" fill="#ffffff" stroke="#174a3a" stroke-width="4"/>
    <text x="680" y="125" font-size="80" fill="#b51f35">♦</text>
    <text x="680" y="178" font-size="20" fill="#174a3a">Karo</text>
  </g>
</svg>
