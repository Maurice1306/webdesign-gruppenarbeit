<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 400"
     role="img"
     aria-labelledby="titel beschreibung">

    <title id="titel">Ghibli-inspirierte Naturlandschaft</title>

    <desc id="beschreibung">
        Eine selbst erstellte Landschaft mit Himmel und Sonne.
    </desc>

<rect       x="0"
            y="0"
            width="800"
            height="400"
            fill="#f7f2e8" />

<circle     cx="650"
            cy="90"
            r="50"
            fill="#d97941" />

<ellipse     cx="250"
             cy="390"
             rx="350"
             ry="140"
             fill="#6f8f6b" />

<ellipse    cx="650"
            cy="400"
            rx="330"
            ry="120"
            fill="#244c3d" />

<rect       x="120"
            y="230"
            width="35"
            height="120"
            fill="#6b4f3a" />

<circle     cx="140"
            cy="220"
            r="65"
             fill="#244c3d" />


<path       d="M 500 400
            C 520 360, 560 330, 610 315
            C 650 305, 680 300, 700 300"
            fill="none"
            stroke="#d9c6a5"
            stroke-width="28"
            stroke-linecap="round" />
</svg>